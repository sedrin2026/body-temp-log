<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YUKINO HEALTH LOG 🧸</title>
  <meta name="theme-color" content="#fff8f6">
  <!-- グラフ描画ライブラリ (Chart.js) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-color: #fff8f6;
      --card-bg: #ffffff;
      --primary: #e88a91;
      --primary-hover: #d7777e;
      --accent-fever: #e76f51;
      --text-main: #4a403a;
      --text-sub: #8c7e75;
      --border-color: #f2e3df;
    }
    body {
      margin: 0;
      padding: 20px 16px;
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      -webkit-tap-highlight-color: transparent;
    }
    .container {
      max-width: 440px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--primary);
      margin: 0;
      letter-spacing: 2px;
    }
    .sub-title {
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-top: 4px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 8px 20px rgba(232, 138, 145, 0.08);
      border: 1px solid var(--border-color);
    }
    .section-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-sub);
      margin-bottom: 12px;
      display: block;
    }

    /* 体温タップボタン群 */
    .temp-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }
    .temp-btn {
      background: #faf6f5;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      color: var(--text-main);
      padding: 10px 0;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .temp-btn:active {
      background: var(--primary);
      color: #fff;
      transform: scale(0.95);
    }

    /* スライダーエリア */
    .slider-box {
      background: #faf6f5;
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      text-align: center;
    }
    .slider-display {
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--primary);
      margin-bottom: 8px;
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--primary);
      margin-bottom: 10px;
      cursor: pointer;
    }
    .slider-actions {
      display: flex;
      gap: 8px;
    }
    .btn-main {
      flex: 2;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 14px;
      padding: 10px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(232, 138, 145, 0.2);
    }
    .btn-clear {
      flex: 1;
      background: #e0d5d2;
      color: #555;
      border: none;
      border-radius: 14px;
      padding: 10px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
    }

    /* 過去日時追加アコーディオン or フォーム */
    .past-form-group {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .past-input {
      background: #faf6f5;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 0.9rem;
      color: var(--text-main);
      width: 100%;
      box-sizing: border-box;
    }
    .btn-sub {
      background: #f2e3df;
      color: var(--text-main);
      border: none;
      border-radius: 12px;
      padding: 8px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
    }

    /* 履歴と削除 */
    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px dotted var(--border-color);
    }
    .history-item:last-child {
      border-bottom: none;
    }
    .temp-val {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--primary);
    }
    .temp-val.fever {
      color: var(--accent-fever);
    }
    .time-val {
      font-size: 0.8rem;
      color: var(--text-sub);
    }
    .delete-btn {
      background: transparent;
      border: none;
      color: #ccc;
      padding: 4px 8px;
      font-size: 0.9rem;
      cursor: pointer;
    }

    /* グラフ用キャンバス */
    .chart-container {
      position: relative;
      width: 100%;
      height: 200px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>YUKINO HEALTH LOG 🧸</h1>
      <div class="sub-title">スマート体温管理</div>
    </header>

    <!-- ①②④ ワンタップ＆スライダー選択エリア -->
    <div class="card">
      <span class="section-title">体温を選択して記録</span>
      
      <!-- よく使うボタン -->
      <div class="temp-grid">
        <button class="temp-btn" onclick="quickRecord(36.2)">36.2°</button>
        <button class="temp-btn" onclick="quickRecord(36.4)">36.4°</button>
        <button class="temp-btn" onclick="quickRecord(36.5)">36.5°</button>
        <button class="temp-btn" onclick="quickRecord(36.6)">36.6°</button>
        <button class="temp-btn" onclick="quickRecord(36.7)">36.7°</button>
        <button class="temp-btn" onclick="quickRecord(36.8)">36.8°</button>
        <button class="temp-btn" onclick="quickRecord(37.0)">37.0°</button>
        <button class="temp-btn" onclick="quickRecord(37.5)">37.5°</button>
      </div>

      <!-- スライダー選択 -->
      <div class="slider-box">
        <div id="sliderDisplay" class="slider-display">36.5°C</div>
        <input type="range" id="tempSlider" min="34.0" max="42.0" step="0.1" value="36.5" oninput="updateSliderText(this.value)">
        <div class="slider-actions">
          <button class="btn-clear" onclick="resetSlider()">クリア</button>
          <button class="btn-main" onclick="recordSlider()">この体温で記録</button>
        </div>
      </div>
    </div>

    <!-- ③ 過去の記録を追加するエリア -->
    <div class="card">
      <span class="section-title">日時を指定して追加（あとから記録）</span>
      <div class="past-form-group">
        <input type="datetime-local" id="pastDateTime" class="past-input">
        <input type="number" id="pastTemp" step="0.1" min="34.0" max="42.0" placeholder="体温 (例: 36.6)" class="past-input">
        <button class="btn-sub" onclick="recordPastData()">指定した日時で追加する</button>
      </div>
    </div>

    <!-- グラフ表示 -->
    <div class="card">
      <span class="section-title">体温グラフ</span>
      <div class="chart-container">
        <canvas id="tempChart"></canvas>
      </div>
    </div>

    <!-- 履歴一覧 -->
    <div class="card">
      <span class="section-title">これまでの記録</span>
      <div id="historyList"></div>
    </div>
  </div>

  <script>
    let tempChart = null;

    // 初期化時に過去日時フォームに現在日時をセットしておく
    function initPastDateTime() {
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      document.getElementById('pastDateTime').value = now.toISOString().slice(0, 16);
    }

    // スライダーの文字連動
    function updateSliderText(val) {
      document.getElementById('sliderDisplay').innerText = parseFloat(val).toFixed(1) + '°C';
    }

    // ①② 誤入力クリア（36.5度にリセット）
    function resetSlider() {
      const slider = document.getElementById('tempSlider');
      slider.value = 36.5;
      updateSliderText(36.5);
    }

    // ①④ ワンタップ即時記録（現在日時）
    function quickRecord(temp) {
      saveData(temp, new Date().toISOString());
    }

    // ①④ スライダーからの記録（現在日時）
    function recordSlider() {
      const temp = document.getElementById('tempSlider').value;
      saveData(temp, new Date().toISOString());
    }

    // ③ 過去日時を指定しての記録
    function recordPastData() {
      const dateTimeVal = document.getElementById('pastDateTime').value;
      const tempVal = document.getElementById('pastTemp').value;

      if (!dateTimeVal || !tempVal) {
        alert('日時と体温の両方を入力してくださいね。');
        return;
      }

      // フォームに入力された日時をUTC/ISO形式に変換
      const isoTime = new Date(dateTimeVal).toISOString();
      saveData(tempVal, isoTime);

      // 体温欄だけクリア
      document.getElementById('pastTemp').value = '';
    }

    // 共通のデータ保存処理
    function saveData(temp, isoTimeString) {
      const records = JSON.parse(localStorage.getItem('body_temp_data') || '[]');
      
      records.unshift({
        time: isoTimeString,
        temp: parseFloat(temp).toFixed(1)
      });

      // 日時の新しい順に並び替えを維持
      records.sort((a, b) => new Date(b.time) - new Date(a.time));

      localStorage.setItem('body_temp_data', JSON.stringify(records));
      updateUI();
    }

    // 削除処理
    function deleteRecord(index) {
      if (!confirm('この記録を消してもよろしいですか？')) return;
      const records = JSON.parse(localStorage.getItem('body_temp_data') || '[]');
      records.splice(index, 1);
      localStorage.setItem('body_temp_data', JSON.stringify(records));
      updateUI();
    }

    // UI & グラフの更新
    function updateUI() {
      const records = JSON.parse(localStorage.getItem('body_temp_data') || '[]');
      
      // 履歴一覧の更新
      const container = document.getElementById('historyList');
      if (records.length === 0) {
        container.innerHTML = '<div style="color:var(--text-sub); text-align:center; padding:12px; font-size:0.85rem;">まだ記録はありません</div>';
      } else {
        container.innerHTML = records.map((item, index) => {
          const isFever = parseFloat(item.temp) >= 37.5;
          const d = new Date(item.time);
          const dateStr = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
          return `
            <div class="history-item">
              <span class="time-val">${dateStr}</span>
              <div style="display:flex; align-items:center; gap:10px;">
                <span class="temp-val ${isFever ? 'fever' : ''}">${item.temp}°C</span>
                <button class="delete-btn" onclick="deleteRecord(${index})">✕</button>
              </div>
            </div>
          `;
        }).join('');
      }

      // グラフの更新処理
      renderChart(records);
    }

    // Chart.js 描画
    function renderChart(records) {
      const ctx = document.getElementById('tempChart').getContext('2d');
      
      // 時系列順（古い順）に並べ替え
      const sorted = [...records].reverse();
      const labels = sorted.map(r => {
        const d = new Date(r.time);
        return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
      });
      const dataValues = sorted.map(r => r.temp);

      if (tempChart) {
        tempChart.destroy();
      }

      tempChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: '体温 (°C)',
            data: dataValues,
            borderColor: '#e88a91',
            backgroundColor: 'rgba(232, 138, 145, 0.15)',
            borderWidth: 2,
            fill: true,
            tension: 0.3,
            pointBackgroundColor: '#e88a91',
            pointRadius: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: {
              min: 35.0,
              max: 38.5,
              ticks: { stepSize: 0.5 }
            },
            x: {
              ticks: { font: { size: 9 }, maxRotation: 45 }
            }
          },
          plugins: {
            legend: { display: false }
          }
        }
      });
    }

    // 初期起動
    initPastDateTime();
    updateUI();
  </script>
</body>
</html>
