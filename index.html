<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>体温ノート - Thermo Log</title>
  <meta name="theme-color" content="#fff8f6">
  <style>
    :root {
      --bg-color: #fff8f6;       /* やわらかい生成り・ピンク系背景 */
      --card-bg: #ffffff;       /* カード背景 */
      --primary: #e88a91;       /* 大人っぽいくすみピンク */
      --primary-hover: #d7777e;
      --accent-fever: #e76f51;   /* 発熱時のアクセント */
      --text-main: #4a403a;      /* 優しいダークブラウン（黒より柔らかい） */
      --text-sub: #8c7e75;       /* サブテキスト */
      --border-color: #f2e3df;  /* 繊細なボーダー色 */
    }
    body {
      margin: 0;
      padding: 20px 16px;
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", MeiRyo, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      -webkit-tap-highlight-color: transparent;
    }
    .container {
      max-width: 440px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--primary);
      margin: 0;
      letter-spacing: 2px;
    }
    .sub-title {
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-top: 4px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 8px 20px rgba(232, 138, 145, 0.08);
      border: 1px solid var(--border-color);
    }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-sub);
      margin-bottom: 8px;
    }
    input, textarea {
      width: 100%;
      box-sizing: border-box;
      background: #faf6f5;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      color: var(--text-main);
      padding: 12px 14px;
      font-size: 0.95rem;
      margin-bottom: 16px;
      outline: none;
      transition: border 0.2s;
    }
    input:focus {
      border-color: var(--primary);
    }
    input[type="number"] {
      font-size: 1.8rem;
      text-align: center;
      font-weight: bold;
      color: var(--primary);
      letter-spacing: 1px;
    }
    button.btn-submit {
      width: 100%;
      background: var(--primary);
      color: #ffffff;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 25px;
      padding: 14px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(238, 138, 145, 0.3);
      transition: background 0.2s, transform 0.1s;
    }
    button.btn-submit:active {
      transform: scale(0.98);
      background: var(--primary-hover);
    }
    .history-header {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-sub);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px dotted var(--border-color);
    }
    .history-item:last-child {
      border-bottom: none;
    }
    .temp-val {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--primary);
    }
    .temp-val.fever {
      color: var(--accent-fever);
    }
    .time-val {
      font-size: 0.8rem;
      color: var(--text-sub);
    }
    .memo-val {
      font-size: 0.85rem;
      color: var(--text-main);
      margin-top: 3px;
    }
    .delete-btn {
      background: transparent;
      border: none;
      color: #ccc;
      padding: 4px 8px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .delete-btn:hover {
      color: var(--accent-fever);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>THERMO LOG</h1>
      <div class="sub-title">毎日のからだの記録</div>
    </header>

    <!-- 入力フォーム -->
    <div class="card">
      <label for="dateTime">日時</label>
      <input type="datetime-local" id="dateTime">

      <label for="temperature">体温 (°C)</label>
      <input type="number" id="temperature" step="0.1" min="34" max="42" placeholder="36.5">

      <label for="memo">メモ</label>
      <input type="text" id="memo" placeholder="例：朝、平熱、頭痛あり、生理1日目">

      <button class="btn-submit" onclick="saveRecord()">きろくする</button>
    </div>

    <!-- 履歴一覧 -->
    <div class="card">
      <div class="history-header">
        <span>これまでの記録</span>
      </div>
      <div id="historyList"></div>
    </div>
  </div>

  <script>
    // 初期表示：現在日時をセット
    function setNowDateTime() {
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      document.getElementById('dateTime').value = now.toISOString().slice(0, 16);
    }

    // データ読み込みと表示
    function loadRecords() {
      const records = JSON.parse(localStorage.getItem('body_temp_data') || '[]');
      const container = document.getElementById('historyList');
      
      if (records.length === 0) {
        container.innerHTML = '<div style="color:var(--text-sub); text-align:center; padding:16px; font-size:0.85rem;">まだ記録はありません</div>';
        return;
      }

      container.innerHTML = records.map((item, index) => {
        const isFever = parseFloat(item.temp) >= 37.5;
        const dateStr = new Date(item.time).toLocaleString('ja-JP', {
          month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit'
        });
        
        return `
          <div class="history-item">
            <div>
              <div class="time-val">${dateStr}</div>
              <div class="memo-val">${item.memo || ''}</div>
            </div>
            <div style="display:flex; align-items:center; gap:12px;">
              <span class="temp-val ${isFever ? 'fever' : ''}">${item.temp}<span style="font-size:0.8rem; margin-left:2px;">°C</span></span>
              <button class="delete-btn" onclick="deleteRecord(${index})">✕</button>
            </div>
          </div>
        `;
      }).join('');
    }

    // 保存処理
    function saveRecord() {
      const time = document.getElementById('dateTime').value;
      const temp = document.getElementById('temperature').value;
      const memo = document.getElementById('memo').value;

      if (!temp) {
        alert('体温を入力してくださいね。');
        return;
      }

      const records = JSON.parse(localStorage.getItem('body_temp_data') || '[]');
      records.unshift({ time, temp, memo });
      localStorage.setItem('body_temp_data', JSON.stringify(records));

      // 入力クリアと再表示
      document.getElementById('temperature').value = '';
      document.getElementById('memo').value = '';
      setNowDateTime();
      loadRecords();
    }

    // 削除処理
    function deleteRecord(index) {
      if (!confirm('この記録を消してもよろしいですか？')) return;
      const records = JSON.parse(localStorage.getItem('body_temp_data') || '[]');
      records.splice(index, 1);
      localStorage.setItem('body_temp_data', JSON.stringify(records));
      loadRecords();
    }

    // 起動時処理
    setNowDateTime();
    loadRecords();
  </script>
</body>
</html>
