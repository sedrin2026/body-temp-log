<!DOCTYPE html>
<html lang="ja">
<head>
 <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YUKINO HEALTH LOG</title>
  <meta name="theme-color" content="#fff8f6">
  <!-- グラフ描画ライブラリ (Chart.js) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-color: #fff8f6;
      --card-bg: #ffffff;
      --primary: #e88a91;
      --primary-hover: #d7777e;
      --accent-fever: #e76f51;
      --text-main: #4a403a;
      --text-sub: #8c7e75;
      --border-color: #f2e3df;
    }
    body {
      margin: 0;
      padding: 20px 16px 40px;
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      -webkit-tap-highlight-color: transparent;
    }
    .container {
      max-width: 440px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header-emoji {
      font-size: 3.5rem;
      margin-bottom: 4px;
      display: inline-block;
    }
    h1 {
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--primary);
      margin: 0;
      letter-spacing: 2px;
    }
    .sub-title {
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-top: 4px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 8px 20px rgba(232, 138, 145, 0.08);
      border: 1px solid var(--border-color);
    }
    .section-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-sub);
      margin-bottom: 12px;
      display: block;
    }

    /* スライダーエリア */
    .slider-box {
      background: #faf6f5;
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 16px;
      text-align: center;
    }
    .slider-display {
      font-size: 2rem;
      font-weight: bold;
      color: var(--primary);
      margin-bottom: 10px;
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--primary);
      margin-bottom: 16px;
      cursor: pointer;
    }
    .slider-actions {
      display: flex;
      gap: 10px;
    }
    .btn-main {
      flex: 2;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 14px;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(232, 138, 145, 0.2);
    }
    .btn-clear {
      flex: 1;
      background: #e0d5d2;
      color: #555;
      border: none;
      border-radius: 14px;
      padding: 12px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
    }

    /* 過去日時追加フォーム */
    .past-form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .past-input {
      background: #faf6f5;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.9rem;
      color: var(--text-main);
      width: 100%;
      box-sizing: border-box;
    }
    .btn-sub {
      background: #f2e3df;
      color: var(--text-main);
      border: none;
      border-radius: 12px;
      padding: 10px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 4px;
    }

    /* 履歴と削除 */
    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px dotted var(--border-color);
    }
    .history-item:last-child {
      border-bottom: none;
    }
    .temp-val {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--primary);
    }
    .temp-val.fever {
      color: var(--accent-fever);
    }
    .time-val {
      font-size: 0.8rem;
      color: var(--text-sub);
    }
    .delete-btn {
      background: transparent;
      border: none;
      color: #ccc;
      padding: 4px 8px;
      font-size: 0.9rem;
      cursor: pointer;
    }

    /* メモ入力エリア */
    .memo-form {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .memo-input {
      flex: 1;
      background: #faf6f5;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.9rem;
      color: var(--text-main);
      box-sizing: border-box;
    }
    .memo-item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 10px 0;
      border-bottom: 1px dotted var(--border-color);
    }
    .memo-item:last-child {
      border-bottom: none;
    }
    .memo-text {
      font-size: 0.9rem;
      color: var(--text-main);
      word-break: break-all;
      white-space: pre-wrap;
    }
    .memo-date {
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-top: 2px;
    }

    /* グラフ用キャンバス */
    .chart-container {
      position: relative;
      width: 100%;
      height: 200px;
    }

    /* カレンダーエリア */
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .calendar-month {
      font-weight: bold;
      color: var(--primary);
      font-size: 1rem;
    }
    .cal-nav-btn {
      background: #faf6f5;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 0.8rem;
      cursor: pointer;
      color: var(--text-main);
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
    }
    .cal-day-label {
      font-size: 0.75rem;
      color: var(--text-sub);
      padding-bottom: 6px;
      font-weight: bold;
    }
    .cal-cell {
      background: #faf6f5;
      border-radius: 10px;
      min-height: 52px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 4px 2px;
      box-sizing: border-box;
      cursor: pointer;
      font-size: 0.75rem;
      position: relative;
      border: 1px solid transparent;
      overflow: hidden;
    }
    .cal-cell.empty {
      background: transparent;
      cursor: default;
    }
    .cal-cell.today {
      border-color: var(--primary);
      font-weight: bold;
      background: #fff0f1;
    }
    .cal-poop {
      font-size: 0.9rem;
      line-height: 1;
      margin-top: 1px;
    }
    .cal-memo-text {
      font-size: 0.6rem;
      color: var(--text-main);
      line-height: 1.1;
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      width: 100%;
      padding: 0 2px;
      box-sizing: border-box;
      font-weight: normal;
    }

    /* 下部スライドモーダル */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 1000;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-content {
      background: #ffffff;
      width: 100%;
      border-radius: 24px 24px 0 0;
      padding: 24px 20px 32px;
      box-sizing: border-box;
      transform: translateY(100%);
      transition: transform 0.3s ease;
      text-align: center;
    }
    .modal-overlay.active .modal-content {
      transform: translateY(0);
    }
    .modal-title {
      font-size: 1rem;
      font-weight: bold;
      color: var(--text-main);
      margin-bottom: 16px;
    }
    .poop-options {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 20px;
    }
    .poop-btn {
      background: #faf6f5;
      border: 2px solid var(--border-color);
      border-radius: 16px;
      padding: 12px 20px;
      font-size: 1.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .poop-btn:active {
      transform: scale(0.95);
      background: #f2e3df;
    }
    .btn-close {
      background: #e0d5d2;
      color: #555;
      border: none;
      border-radius: 12px;
      padding: 10px 24px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-emoji">🦔</div>
      <h1>YUKINO HEALTH LOG</h1>
      <div class="sub-title">スマート体温管理</div>
    </header>

    <!-- スライダー選択エリア -->
    <div class="card">
      <span class="section-title">体温をスライドして記録</span>
      <div class="slider-box">
        <div id="sliderDisplay" class="slider-display">36.5°C</div>
        <input type="range" id="tempSlider" min="34.0" max="42.0" step="0.1" value="36.5" oninput="updateSliderText(this.value)">
        <div class="slider-actions">
          <button class="btn-clear" onclick="clearLastRecord()">クリア</button>
          <button class="btn-main" onclick="recordSlider()">この体温で記録</button>
        </div>
      </div>
    </div>

    <!-- 過去の記録を追加するエリア -->
    <div class="card">
      <span class="section-title">日時を指定して追加（あとから記録）</span>
      <div class="past-form-group">
        <input type="datetime-local" id="pastDateTime" class="past-input">
        <input type="number" id="pastTemp" step="0.1" min="34.0" max="42.0" placeholder="体温 (例: 36.6)" class="past-input">
        <button class="btn-sub" onclick="recordPastData()">指定した日時で追加する</button>
      </div>
    </div>

    <!-- グラフ表示 -->
    <div class="card">
      <span class="section-title">体温グラフ</span>
      <div class="chart-container">
        <canvas id="tempChart"></canvas>
      </div>
    </div>

    <!-- 履歴一覧 -->
    <div class="card">
      <span class="section-title">これまでの記録</span>
      <div id="historyList"></div>
    </div>

    <!-- メモエリア -->
    <div class="card">
      <span class="section-title">メモ（体調や解熱剤など）</span>
      <div class="memo-form">
        <input type="text" id="memoText" class="memo-input" placeholder="例: 解熱剤を飲んだ、頭痛あり">
        <button class="btn-sub" style="margin-top:0; padding:10px 16px;" onclick="addMemo()">残す</button>
      </div>
      <div id="memoList"></div>
    </div>

    <!-- カレンダー（お通じ＆メモ記録） -->
    <div class="card">
      <span class="section-title">ヘルスログカレンダー 📅</span>
      <div class="calendar-header">
        <button class="cal-nav-btn" onclick="changeMonth(-1)">＜ 前月</button>
        <div id="calendarTitle" class="calendar-month"></div>
        <button class="cal-nav-btn" onclick="changeMonth(1)">翌月 ＞</button>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
    </div>
  </div>

  <!-- 下から出るモーダル（💩選択） -->
  <div class="modal-overlay" id="poopModal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-title" id="modalDateTitle">5月15日の記録</div>
      <div class="poop-options">
        <button class="poop-btn" onclick="setPoop(true)">💩</button>
        <button class="poop-btn" style="font-size:1rem; padding:16px;" onclick="setPoop(false)">なし</button>
      </div>
      <button class="btn-close" onclick="closeModal()">閉じる</button>
    </div>
  </div>

  <script>
    let tempChart = null;
    let currentCalDate = new Date();
    let selectedDateStr = "";

    // サービスワーカー（オフライン対応）の登録
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('ServiceWorker registered!', reg))
          .catch(err => console.log('ServiceWorker error:', err));
      });
    }

    // 初期化時に過去日時フォームに現在日時をセット
    function initPastDateTime() {
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      document.getElementById('pastDateTime').value = now.toISOString().slice(0, 16);
    }

    // スライダーの文字連動
    function updateSliderText(val) {
      document.getElementById('sliderDisplay').innerText = parseFloat(val).toFixed(1) + '°C';
    }

    // クリアボタン：直近（一番新しい）の記録を1件削除
    function clearLastRecord() {
      const records = JSON.parse(localStorage.getItem('body_temp_data') || '[]');
      if (records.length === 0) {
        alert('削除できる記録がありません。');
        return;
      }
      records.shift();
      localStorage.setItem('body_temp_data', JSON.stringify(records));
      updateUI();
    }

    // スライダーからの記録
    function recordSlider() {
      const temp = document.getElementById('tempSlider').value;
      saveData(temp, new Date().toISOString());
    }

    // 過去日時を指定しての記録
    function recordPastData() {
      const dateTimeVal = document.getElementById('pastDateTime').value;
      const tempVal = document.getElementById('pastTemp').value;
      if (!dateTimeVal || !tempVal) {
        alert('日時と体温の両方を入力してくださいね。');
        return;
      }
      const isoTime = new Date(dateTimeVal).toISOString();
      saveData(tempVal, isoTime);
      document.getElementById('pastTemp').value = '';
    }

    // 共通のデータ保存処理
    function saveData(temp, isoTimeString) {
      const records = JSON.parse(localStorage.getItem('body_temp_data') || '[]');
      records.unshift({
        time: isoTimeString,
        temp: parseFloat(temp).toFixed(1)
      });
      records.sort((a, b) => new Date(b.time) - new Date(a.time));
      localStorage.setItem('body_temp_data', JSON.stringify(records));
      updateUI();
    }

    // 個別削除処理
    function deleteRecord(index) {
      if (!confirm('この記録を消してもよろしいですか？')) return;
      const records = JSON.parse(localStorage.getItem('body_temp_data') || '[]');
      records.splice(index, 1);
      localStorage.setItem('body_temp_data', JSON.stringify(records));
      updateUI();
    }

    // メモ追加
    function addMemo() {
      const input = document.getElementById('memoText');
      const text = input.value.trim();
      if (!text) return;
      const memos = JSON.parse(localStorage.getItem('body_temp_memos') || '[]');
      memos.unshift({
        time: new Date().toISOString(),
        text: text
      });
      localStorage.setItem('body_temp_memos', JSON.stringify(memos));
      input.value = '';
      updateUI();
    }

    // メモ削除
    function deleteMemo(index) {
      if (!confirm('このメモを消してもよろしいですか？')) return;
      const memos = JSON.parse(localStorage.getItem('body_temp_memos') || '[]');
      memos.splice(index, 1);
      localStorage.setItem('body_temp_memos', JSON.stringify(memos));
      updateUI();
    }

    // カレンダー描画（メモ＆💩連動）
    function renderCalendar() {
      const year = currentCalDate.getFullYear();
      const month = currentCalDate.getMonth();
      document.getElementById('calendarTitle').innerText = `${year}年 ${month + 1}月`;

      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      const dayLabels = ['日', '月', '火', '水', '木', '金', '土'];
      dayLabels.forEach(d => {
        grid.innerHTML += `<div class="cal-day-label">${d}</div>`;
      });

      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();
      const poopData = JSON.parse(localStorage.getItem('body_temp_poop') || '{}');
      const memos = JSON.parse(localStorage.getItem('body_temp_memos') || '[]');
      const today = new Date();

      // 日付ごとのメモをマッピング
      const memoMap = {};
      memos.forEach(m => {
        const d = new Date(m.time);
        const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        if (!memoMap[key]) {
          memoMap[key] = m.text;
        }
      });

      for (let i = 0; i < firstDay; i++) {
        grid.innerHTML += `<div class="cal-cell empty"></div>`;
      }

      for (let date = 1; date <= lastDate; date++) {
        const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(date).padStart(2, '0')}`;
        const isToday = today.getFullYear() === year && today.getMonth() === month && today.getDate() === date;
        const hasPoop = poopData[dateKey];
        const dayMemo = memoMap[dateKey] || '';

        grid.innerHTML += `
          <div class="cal-cell ${isToday ? 'today' : ''}" onclick="openPoopModal('${dateKey}', ${month + 1}, ${date})">
            <span>${date}</span>
            ${hasPoop ? '<span class="cal-poop">💩</span>' : ''}
            ${dayMemo ? `<span class="cal-memo-text">${escapeHtml(dayMemo)}</span>` : ''}
          </div>
        `;
      }
    }

    function changeMonth(diff) {
      currentCalDate.setMonth(currentCalDate.getMonth() + diff);
      renderCalendar();
    }

    function openPoopModal(dateKey, m, d) {
      selectedDateStr = dateKey;
      document.getElementById('modalDateTitle').innerText = `${m}月${d}日の記録`;
      document.getElementById('poopModal').classList.add('active');
    }

    function closeModal(e) {
      document.getElementById('poopModal').classList.remove('active');
    }

    function setPoop(hasPoop) {
      const poopData = JSON.parse(localStorage.getItem('body_temp_poop') || '{}');
      if (hasPoop) {
        poopData[selectedDateStr] = true;
      } else {
        delete poopData[selectedDateStr];
      }
      localStorage.setItem('body_temp_poop', JSON.stringify(poopData));
      closeModal();
      renderCalendar();
    }

    // UI & グラフの更新
    function updateUI() {
      const records = JSON.parse(localStorage.getItem('body_temp_data') || '[]');
      const memos = JSON.parse(localStorage.getItem('body_temp_memos') || '[]');
      
      // 履歴一覧
      const container = document.getElementById('historyList');
      if (records.length === 0) {
        container.innerHTML = '<div style="color:var(--text-sub); text-align:center; padding:12px; font-size:0.85rem;">まだ記録はありません</div>';
      } else {
        container.innerHTML = records.map((item, index) => {
          const isFever = parseFloat(item.temp) >= 37.5;
          const d = new Date(item.time);
          const dateStr = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
          return `
            <div class="history-item">
              <span class="time-val">${dateStr}</span>
              <div style="display:flex; align-items:center; gap:10px;">
                <span class="temp-val ${isFever ? 'fever' : ''}">${item.temp}°C</span>
                <button class="delete-btn" onclick="deleteRecord(${index})">✕</button>
              </div>
            </div>
          `;
        }).join('');
      }

      // メモ一覧
      const memoContainer = document.getElementById('memoList');
      if (memos.length === 0) {
        memoContainer.innerHTML = '<div style="color:var(--text-sub); text-align:center; padding:12px; font-size:0.85rem;">メモはありません</div>';
      } else {
        memoContainer.innerHTML = memos.map((item, index) => {
          const d = new Date(item.time);
          const dateStr = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
          return `
            <div class="memo-item">
              <div>
                <div class="memo-text">${escapeHtml(item.text)}</div>
                <div class="memo-date">${dateStr}</div>
              </div>
              <button class="delete-btn" onclick="deleteMemo(${index})">✕</button>
            </div>
          `;
        }).join('');
      }

      renderChart(records);
      renderCalendar();
    }

    // エスケープ処理
    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
      });
    }

    // Chart.js 描画
    function renderChart(records) {
      const ctx = document.getElementById('tempChart').getContext('2d');
      const sorted = [...records].reverse();
      const labels = sorted.map(r => {
        const d = new Date(r.time);
        return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
      });
      const dataValues = sorted.map(r => r.temp);

      if (tempChart) {
        tempChart.destroy();
      }

      tempChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: '体温 (°C)',
            data: dataValues,
            borderColor: '#e88a91',
            backgroundColor: 'rgba(232, 138, 145, 0.15)',
            borderWidth: 2,
            fill: true,
            tension: 0.3,
            pointBackgroundColor: '#e88a91',
            pointRadius: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: {
              min: 35.0,
              max: 38.5,
              ticks: { stepSize: 0.5 }
            },
            x: {
              ticks: { font: { size: 9 }, maxRotation: 45 }
            }
          },
          plugins: {
            legend: { display: false }
          }
        }
      });
    }

    // データの変更検知
    window.addEventListener('storage', function(e) {
      if (e.key === 'body_temp_data' || e.key === 'body_temp_memos' || e.key === 'body_temp_poop') {
        updateUI();
      }
    });

    // 初期起動
    initPastDateTime();
    updateUI();
  </script>
</body>
</html>
