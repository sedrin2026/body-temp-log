<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YUKINO HEALTH LOG</title>
  
  <link rel="manifest" href="manifest.json?v=20260801">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  
  <meta name="theme-color" content="#fff8f6">
  <!-- グラフ描画ライブラリ (Chart.js) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-color: #fff8f6;
      --card-bg: #ffffff;
      --primary: #e88a91;
      --primary-hover: #d7777e;
      --accent-fever: #e76f51;
      --text-main: #4a403a;
      --text-sub: #8c7e75;
      --border-color: #f2e3df;
    }
    body {
      margin: 0;
      padding: 2px 8px 12px;
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      -webkit-tap-highlight-color: transparent;
    }
    .container {
      max-width: 440px;
      margin: 0 auto;
    }
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 2px;
      padding: 0 2px;
    }
    .header-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      object-fit: cover;
      box-shadow: 0 2px 4px rgba(232, 138, 145, 0.15);
      flex-shrink: 0;
    }
    .header-text-group {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    h1 {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--primary);
      margin: 0;
      letter-spacing: 1px;
      line-height: 1.2;
    }
    .sub-title {
      font-size: 0.55rem;
      color: var(--text-sub);
      margin-top: 1px;
      line-height: 1.1;
    }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 3px 8px;
      margin-bottom: 3px;
      box-shadow: 0 2px 8px rgba(232, 138, 145, 0.05);
      border: 1px solid var(--border-color);
    }
    .section-title {
      font-size: 0.65rem;
      font-weight: 600;
      color: var(--text-sub);
      margin-bottom: 2px;
      display: block;
    }
    .slider-box {
      background: #faf6f5;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 2px 6px;
      text-align: center;
    }
    .slider-display {
      font-size: 1.15rem;
      font-weight: bold;
      color: var(--primary);
      margin-bottom: 0px;
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--primary);
      margin: 1px 0 2px;
      cursor: pointer;
    }
    .slider-actions {
      display: flex;
      gap: 6px;
    }
    .btn-main {
      flex: 2;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 3px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 4px rgba(232, 138, 145, 0.2);
      transition: background-color 0.1s ease, transform 0.1s ease;
    }
    .btn-main:active {
      background-color: #c96b73;
      transform: scale(0.98);
    }
    .btn-clear {
      flex: 1;
      background: #e0d5d2;
      color: #555;
      border: none;
      border-radius: 8px;
      padding: 3px;
      font-size: 0.65rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.1s ease, transform 0.1s ease;
    }
    .btn-clear:active {
      background-color: #c5b8b5;
      transform: scale(0.98);
    }
    .weather-picker {
      display: flex;
      justify-content: space-around;
      margin-bottom: 2px;
    }
    .weather-btn {
      background: #faf6f5;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 1px 5px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .weather-btn.selected {
      border-color: var(--primary);
      background: #fff0f1;
    }
    .chart-container {
      position: relative;
      width: 100%;
      height: 110px;
    }
    .chart-legend-note {
      font-size: 0.48rem;
      color: var(--text-sub);
      text-align: center;
      margin-top: 1px;
      line-height: 1.2;
    }
    .past-form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .past-input {
      background: #faf6f5;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 0.85rem;
      color: var(--text-main);
      width: 100%;
      box-sizing: border-box;
    }
    .btn-sub {
      background: #f2e3df;
      color: var(--text-main);
      border: none;
      border-radius: 10px;
      padding: 8px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
    }
    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px dotted var(--border-color);
    }
    .history-item:last-child {
      border-bottom: none;
    }
    .temp-val {
      font-size: 1rem;
      font-weight: bold;
      color: var(--primary);
    }
    .temp-val.fever {
      color: var(--accent-fever);
    }
    .time-val {
      font-size: 0.75rem;
      color: var(--text-sub);
    }
    .delete-btn {
      background: transparent;
      border: none;
      color: #ccc;
      padding: 4px 8px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .memo-form {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    .memo-input {
      flex: 1;
      background: #faf6f5;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 0.85rem;
      color: var(--text-main);
      box-sizing: border-box;
    }
    .memo-item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 8px 0;
      border-bottom: 1px dotted var(--border-color);
    }
    .memo-item:last-child {
      border-bottom: none;
    }
    .memo-text {
      font-size: 0.85rem;
      color: var(--text-main);
      word-break: break-all;
      white-space: pre-wrap;
    }
    .memo-date {
      font-size: 0.7rem;
      color: var(--text-sub);
      margin-top: 2px;
    }
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .calendar-month {
      font-weight: bold;
      color: var(--primary);
      font-size: 0.85rem;
    }
    .cal-nav-btn {
      background: #faf6f5;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 0.7rem;
      cursor: pointer;
      color: var(--text-main);
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      text-align: center;
    }
    .cal-day-label {
      font-size: 0.65rem;
      color: var(--text-sub);
      padding-bottom: 1px;
      font-weight: bold;
    }
    .cal-cell {
      background: #faf6f5;
      border-radius: 6px;
      min-height: 35px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 1px;
      box-sizing: border-box;
      cursor: pointer;
      font-size: 0.65rem;
      position: relative;
      border: 1px solid transparent;
      overflow: hidden;
    }
    .cal-cell.empty {
      background: transparent;
      cursor: default;
    }
    .cal-cell.today {
      border-color: var(--primary);
      font-weight: bold;
      background: #fff0f1;
    }
    .cal-icons {
      display: flex;
      gap: 1px;
      font-size: 0.55rem;
      line-height: 1;
      margin-top: 1px;
    }
    .cal-memo-text {
      font-size: 0.45rem;
      color: var(--text-main);
      line-height: 1;
      margin-top: 1px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      width: 100%;
      padding: 0 1px;
      box-sizing: border-box;
      font-weight: normal;
    }
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 1000;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-content {
      background: #ffffff;
      width: 100%;
      border-radius: 24px 24px 0 0;
      padding: 20px 20px 28px;
      box-sizing: border-box;
      transform: translateY(100%);
      transition: transform 0.3s ease;
      text-align: center;
    }
    .modal-overlay.active .modal-content {
      transform: translateY(0);
    }
    .modal-title {
      font-size: 0.95rem;
      font-weight: bold;
      color: var(--text-main);
      margin-bottom: 14px;
    }
    .log-options {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 18px;
    }
    .log-btn {
      background: #faf6f5;
      border: 2px solid var(--border-color);
      border-radius: 14px;
      padding: 10px 14px;
      font-size: 1.4rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .log-btn.selected {
      border-color: var(--primary);
      background: #fff0f1;
    }
    .btn-close {
      background: #e0d5d2;
      color: #555;
      border: none;
      border-radius: 12px;
      padding: 8px 22px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <img src="icon.png" alt="YUKINO HEALTH LOG" class="header-icon">
      <div class="header-text-group">
        <h1>YUKINO HEALTH LOG</h1>
        <div class="sub-title">スマート体温管理 Ver2</div>
      </div>
    </header>

    <!-- ① 体温記録スライダーエリア -->
    <div class="card">
      <span class="section-title">体温をスライドして記録</span>
      <div class="slider-box">
        <div id="sliderDisplay" class="slider-display">36.5°C</div>
        <input type="range" id="tempSlider" min="34.0" max="42.0" step="0.1" value="36.5" oninput="updateSliderText(this.value)">
        
        <div class="weather-picker">
          <button type="button" class="weather-btn selected" onclick="selectWeather('☀️', this)">☀️</button>
          <button type="button" class="weather-btn" onclick="selectWeather('☁️', this)">☁️</button>
          <button type="button" class="weather-btn" onclick="selectWeather('🌧️', this)">🌧️</button>
          <button type="button" class="weather-btn" onclick="selectWeather('❄️', this)">❄️</button>
        </div>

        <div class="slider-actions">
          <button class="btn-clear" onclick="clearLastRecord()">クリア</button>
          <button class="btn-main" onclick="recordSlider()">この体温で記録</button>
        </div>
      </div>
    </div>

    <!-- ② 体温グラフエリア -->
    <div class="card">
      <span class="section-title">体温グラフ ＆ ヘルスログ</span>
      <div class="chart-container">
        <canvas id="tempChart"></canvas>
      </div>
      <div class="chart-legend-note">🌡️体温 ｜ 💩排便(茶) ｜ 🩸出血(赤) ｜ ⚡頭痛(青)</div>
    </div>

    <!-- ③ ヘルスログカレンダーエリア -->
    <div class="card">
      <span class="section-title">ヘルスログカレンダー 📅</span>
      <div class="calendar-header">
        <button class="cal-nav-btn" onclick="changeMonth(-1)">＜ 前月</button>
        <div id="calendarTitle" class="calendar-month"></div>
        <button class="cal-nav-btn" onclick="changeMonth(1)">翌月 ＞</button>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
    </div>

    <!-- ④ 日時を指定して追加（あとから記録）エリア -->
    <div class="card">
      <span class="section-title">日時を指定して追加（あとから記録）</span>
      <div class="past-form-group">
        <input type="datetime-local" id="pastDateTime" class="past-input">
        <input type="number" id="pastTemp" step="0.1" min="34.0" max="42.0" placeholder="体温 (例: 36.6)" class="past-input">
        <button class="btn-sub" onclick="recordPastData()">指定した日時で追加する</button>
      </div>
    </div>

    <!-- ⑤ これまでの記録エリア -->
    <div class="card">
      <span class="section-title">これまでの記録</span>
      <div id="historyList"></div>
    </div>

    <!-- ⑥ メモエリア -->
    <div class="card">
      <span class="section-title">メモ（体調や解熱剤など）</span>
      <div class="memo-form">
        <input type="text" id="memoText" class="memo-input" placeholder="例: 解熱剤を飲んだ、頭痛あり">
        <button class="btn-sub" style="margin-top:0; padding:8px 14px;" onclick="addMemo()">残す</button>
      </div>
      <div id="memoList"></div>
    </div>
  </div>

  <!-- ログ選択モーダル -->
  <div class="modal-overlay" id="poopModal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-title" id="modalDateTitle">5月15日の記録</div>
      <div class="log-options">
        <button class="log-btn" id="btnPoop" onclick="toggleLogType('poop')">💩</button>
        <button class="log-btn" id="btnBleed" onclick="toggleLogType('bleed')">🩸</button>
        <button class="log-btn" id="btnHeadache" onclick="toggleLogType('headache')">⚡</button>
      </div>
      <button class="btn-close" onclick="closeModal()">閉じる</button>
    </div>
  </div>

  <script>
    let tempChart = null;
    let currentCalDate = new Date();
    let selectedDateStr = "";
    let selectedWeatherIcon = "☀️";

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js?v=20260801').then(registration => {
          registration.onupdatefound = () => {
            const installingWorker = registration.installing;
            installingWorker.onstatechange = () => {
              if (installingWorker.state === 'installed') {
                if (navigator.serviceWorker.controller) {
                  console.log('新しいコンテンツが利用可能です。リロードしてください。');
                }
              }
            };
          };
        }).catch(err => console.log('SW error:', err));
      });
    }

    function initPastDateTime() {
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      document.getElementById('pastDateTime').value = now.toISOString().slice(0, 16);
    }

    function updateSliderText(val) {
      document.getElementById('sliderDisplay').innerText = parseFloat(val).toFixed(1) + '°C';
    }

    function selectWeather(weather, btn) {
      selectedWeatherIcon = weather;
      document.querySelectorAll('.weather-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    }

    function clearLastRecord() {
      const records = JSON.parse(localStorage.getItem('body_temp_data') || '[]');
      if (records.length === 0) { alert('削除できる記録がありません。'); return; }
      records.shift();
      localStorage.setItem('body_temp_data', JSON.stringify(records));
      updateUI();
    }

    function recordSlider() {
      const temp = document.getElementById('tempSlider').value;
      saveData(temp, new Date().toISOString(), selectedWeatherIcon);
    }

    function recordPastData() {
      const dateTimeVal = document.getElementById('pastDateTime').value;
      const tempVal = document.getElementById('pastTemp').value;
      if (!dateTimeVal || !tempVal) { alert('日時と体温の両方を入力してくださいね。'); return; }
      saveData(tempVal, new Date(dateTimeVal).toISOString(), '☀️');
      document.getElementById('pastTemp').value = '';
    }

    function saveData(temp, isoTimeString, weather) {
      const records = JSON.parse(localStorage.getItem('body_temp_data') || '[]');
      records.unshift({ time: isoTimeString, temp: parseFloat(temp).toFixed(1), weather: weather || '☀️' });
      records.sort((a, b) => new Date(b.time) - new Date(a.time));
      localStorage.setItem('body_temp_data', JSON.stringify(records));
      updateUI();
    }

    function deleteRecord(index) {
      if (!confirm('この記録を消してもよろしいですか？')) return;
      const records = JSON.parse(localStorage.getItem('body_temp_data') || '[]');
      records.splice(index, 1);
      localStorage.setItem('body_temp_data', JSON.stringify(records));
      updateUI();
    }

    function addMemo() {
      const input = document.getElementById('memoText');
      const text = input.value.trim();
      if (!text) return;
      const memos = JSON.parse(localStorage.getItem('body_temp_memos') || '[]');
      memos.unshift({ time: new Date().toISOString(), text: text });
      localStorage.setItem('body_temp_memos', JSON.stringify(memos));
      input.value = '';
      updateUI();
    }

    function deleteMemo(index) {
      if (!confirm('このメモを消してもよろしいですか？')) return;
      const memos = JSON.parse(localStorage.getItem('body_temp_memos') || '[]');
      memos.splice(index, 1);
      localStorage.setItem('body_temp_memos', JSON.stringify(memos));
      updateUI();
    }

    function renderCalendar() {
      const year = currentCalDate.getFullYear();
      const month = currentCalDate.getMonth();
      document.getElementById('calendarTitle').innerText = `${year}年 ${month + 1}月`;
      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';
      ['日', '月', '火', '水', '木', '金', '土'].forEach(d => {
        grid.innerHTML += `<div class="cal-day-label">${d}</div>`;
      });
      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();
      
      const poopData = JSON.parse(localStorage.getItem('body_temp_poop') || '{}');
      const bleedData = JSON.parse(localStorage.getItem('body_temp_bleed') || '{}');
      const headacheData = JSON.parse(localStorage.getItem('body_temp_headache') || '{}');
      const records = JSON.parse(localStorage.getItem('body_temp_data') || '[]');
      const memos = JSON.parse(localStorage.getItem('body_temp_memos') || '[]');
      const today = new Date();

      const weatherMap = {}, memoMap = {};
      records.forEach(r => {
        const d = new Date(r.time);
        const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        if (!weatherMap[key]) weatherMap[key] = r.weather;
      });
      memos.forEach(m => {
        const d = new Date(m.time);
        const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        if (!memoMap[key]) memoMap[key] = m.text;
      });

      for (let i = 0; i < firstDay; i++) {
        grid.innerHTML += `<div class="cal-cell empty"></div>`;
      }
      for (let date = 1; date <= lastDate; date++) {
        const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(date).padStart(2, '0')}`;
        const isToday = today.getFullYear() === year && today.getMonth() === month && today.getDate() === date;
        grid.innerHTML += `
          <div class="cal-cell ${isToday ? 'today' : ''}" onclick="openPoopModal('${dateKey}', ${month + 1}, ${date})">
            <span>${date}</span>
            <div class="cal-icons">
              ${weatherMap[dateKey] ? `<span>${weatherMap[dateKey]}</span>` : ''}
              ${poopData[dateKey] ? '<span>💩</span>' : ''}
              ${bleedData[dateKey] ? '<span>🩸</span>' : ''}
              ${headacheData[dateKey] ? '<span>⚡</span>' : ''}
            </div>
            ${memoMap[dateKey] ? `<span class="cal-memo-text">${escapeHtml(memoMap[dateKey])}</span>` : ''}
          </div>
        `;
      }
    }

    function changeMonth(diff) {
      currentCalDate.setMonth(currentCalDate.getMonth() + diff);
      renderCalendar();
    }

    function openPoopModal(dateKey, m, d) {
      selectedDateStr = dateKey;
      document.getElementById('modalDateTitle').innerText = `${m}月${d}日の記録`;
      
      const poopData = JSON.parse(localStorage.getItem('body_temp_poop') || '{}');
      const bleedData = JSON.parse(localStorage.getItem('body_temp_bleed') || '{}');
      const headacheData = JSON.parse(localStorage.getItem('body_temp_headache') || '{}');

      document.getElementById('btnPoop').className = 'log-btn ' + (poopData[dateKey] ? 'selected' : '');
      document.getElementById('btnBleed').className = 'log-btn ' + (bleedData[dateKey] ? 'selected' : '');
      document.getElementById('btnHeadache').className = 'log-btn ' + (headacheData[dateKey] ? 'selected' : '');

      document.getElementById('poopModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('poopModal').classList.remove('active');
      updateUI();
    }

    function toggleLogType(type) {
      if (type === 'poop') {
        const poopData = JSON.parse(localStorage.getItem('body_temp_poop') || '{}');
        if (poopData[selectedDateStr]) delete poopData[selectedDateStr];
        else poopData[selectedDateStr] = true;
        localStorage.setItem('body_temp_poop', JSON.stringify(poopData));
        document.getElementById('btnPoop').classList.toggle('selected');
      } else if (type === 'bleed') {
        const bleedData = JSON.parse(localStorage.getItem('body_temp_bleed') || '{}');
        if (bleedData[selectedDateStr]) delete bleedData[selectedDateStr];
        else bleedData[selectedDateStr] = true;
        localStorage.setItem('body_temp_bleed', JSON.stringify(bleedData));
        document.getElementById('btnBleed').classList.toggle('selected');
      } else if (type === 'headache') {
        const headacheData = JSON.parse(localStorage.getItem('body_temp_headache') || '{}');
        if (headacheData[selectedDateStr]) delete headacheData[selectedDateStr];
        else headacheData[selectedDateStr] = true;
        localStorage.setItem('body_temp_headache', JSON.stringify(headacheData));
        document.getElementById('btnHeadache').classList.toggle('selected');
      }
      renderCalendar();
    }

    function updateUI() {
      const records = JSON.parse(localStorage.getItem('body_temp_data') || '[]');
      const memos = JSON.parse(localStorage.getItem('body_temp_memos') || '[]');
      const container = document.getElementById('historyList');
      if (records.length === 0) {
        container.innerHTML = '<div style="color:var(--text-sub); text-align:center; padding:8px; font-size:0.8rem;">まだ記録はありません</div>';
      } else {
        container.innerHTML = records.map((item, index) => {
          const isFever = parseFloat(item.temp) >= 37.5;
          const d = new Date(item.time);
          const dateStr = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
          return `
            <div class="history-item">
              <span class="time-val">${item.weather || '☀️'} ${dateStr}</span>
              <div style="display:flex; align-items:center; gap:8px;">
                <span class="temp-val ${isFever ? 'fever' : ''}">${item.temp}°C</span>
                <button class="delete-btn" onclick="deleteRecord(${index})">✕</button>
              </div>
            </div>
          `;
        }).join('');
      }

      const memoContainer = document.getElementById('memoList');
      if (memoContainer) {
        if (memos.length === 0) {
          memoContainer.innerHTML = '<div style="color:var(--text-sub); text-align:center; padding:8px; font-size:0.8rem;">メモはありません</div>';
        } else {
          memoContainer.innerHTML = memos.map((item, index) => {
            const d = new Date(item.time);
            const dateStr = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
            return `
              <div class="memo-item">
                <div>
                  <div class="memo-text">${escapeHtml(item.text)}</div>
                  <div class="memo-date">${dateStr}</div>
                </div>
                <button class="delete-btn" onclick="deleteMemo(${index})">✕</button>
              </div>
            `;
          }).join('');
        }
      }
      renderChart(records);
      renderCalendar();
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
      });
    }

    function renderChart(records) {
      const ctx = document.getElementById('tempChart').getContext('2d');
      const sorted = [...records].reverse();
      const labels = sorted.map(r => {
        const d = new Date(r.time);
        return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
      });
      const dataValues = sorted.map(r => r.temp);
      const pointColors = sorted.map(r => {
        const h = new Date(r.time).getHours();
        if (h >= 7 && h <= 11) return '#4ea8de';
        else if (h >= 12 && h <= 18) return '#f4a261';
        else return '#1d3557';
      });

      // 日付ベースの排便・出血・頭痛データを構築
      const poopData = JSON.parse(localStorage.getItem('body_temp_poop') || '{}');
      const bleedData = JSON.parse(localStorage.getItem('body_temp_bleed') || '{}');
      const headacheData = JSON.parse(localStorage.getItem('body_temp_headache') || '{}');

      const poopValues = sorted.map(r => {
        const d = new Date(r.time);
        const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        return poopData[key] ? 35.5 : null; // グラフ下部に表示する固定ライン値
      });

      const bleedValues = sorted.map(r => {
        const d = new Date(r.time);
        const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        return bleedData[key] ? 35.3 : null;
      });

      const headacheValues = sorted.map(r => {
        const d = new Date(r.time);
        const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        return headacheData[key] ? 35.1 : null;
      });

      if (tempChart) tempChart.destroy();
      tempChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            {
              label: '体温 (°C)',
              data: dataValues,
              borderColor: '#e88a91',
              backgroundColor: 'rgba(232, 138, 145, 0.15)',
              borderWidth: 2,
              fill: true,
              tension: 0.3,
              pointBackgroundColor: pointColors,
              pointBorderColor: pointColors,
              pointRadius: 4,
              yAxisID: 'y'
            },
            {
              label: '排便 (💩)',
              data: poopValues,
              borderColor: '#8d5524',
              backgroundColor: '#8d5524',
              pointRadius: 6,
              pointStyle: 'rectRot',
              showLine: false,
              yAxisID: 'y'
            },
            {
              label: '出血 (🩸)',
              data: bleedValues,
              borderColor: '#d90429',
              backgroundColor: '#d90429',
              pointRadius: 6,
              pointStyle: 'triangle',
              showLine: false,
              yAxisID: 'y'
            },
            {
              label: '頭痛 (⚡)',
              data: headacheValues,
              borderColor: '#0077b6',
              backgroundColor: '#0077b6',
              pointRadius: 6,
              pointStyle: 'circle',
              showLine: false,
              yAxisID: 'y'
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: { min: 35.0, max: 38.5, ticks: { stepSize: 0.5, font: { size: 8 } } },
            x: { ticks: { font: { size: 6 }, maxRotation: 45 } }
          },
          plugins: { legend: { display: false } }
        }
      });
    }

    initPastDateTime();
    updateUI();
  </script>
</body>
</html>
